name: CI

on:
  push:
    paths:
      - "ai_project/fumadocs_ingest_service/**"
  pull_request:
    paths:
      - "ai_project/fumadocs_ingest_service/**"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai_project/fumadocs_ingest_service
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest -q
