name: CI (service-level — NOTE: this file is not read by GitHub)
# NOTE: GitHub Actions only reads .github/workflows/ from the repository ROOT.
# This file lives inside a subdirectory and is therefore NOT executed by GitHub Actions.
# The active CI workflow is at: /.github/workflows/main.yml (repo root).
# This file is kept for local reference / inner-service documentation only.

on:
  push:
    paths:
      - "kwikid-ai-ingest/ai_project/fumadocs_ingest_service/**"
  pull_request:
    paths:
      - "kwikid-ai-ingest/ai_project/fumadocs_ingest_service/**"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kwikid-ai-ingest/ai_project/fumadocs_ingest_service
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest -q
