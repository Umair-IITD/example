[pytest]
# Sprint 2.53 Wave 4A — register pytest-asyncio auto mode so tests that use
# @pytest.mark.asyncio (Sprint 2.50/2.51/2.52/2.53 async httpx / openai) run
# under the pytest-asyncio backend without needing a per-invocation flag.
asyncio_mode = auto
filterwarnings =
    ignore::DeprecationWarning:pydantic._internal._config
    ignore::DeprecationWarning:pydantic._internal._generate_schema
