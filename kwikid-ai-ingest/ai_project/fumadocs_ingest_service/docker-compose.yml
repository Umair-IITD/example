services:

  # ── Application ──────────────────────────────────────────────────────────────
  fumadocs-api:
    container_name: fumadocs-api
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    ports:
      - "8000:8000"
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test:
        - "CMD"
        - "python"
        - "-c"
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 1g

  # ── Redis: distributed rate limiter ──────────────────────────────────────────
  # Disabled by default in the application (REDIS_RATE_LIMIT_ENABLED=false).
  # Set REDIS_RATE_LIMIT_ENABLED=true and REDIS_URL=redis://redis:6379 in .env
  # to activate distributed rate limiting across uvicorn workers.
  #
  # Configuration:
  #   - maxmemory 256mb: bounded memory footprint for rate-limit keys
  #   - allkeys-lru: evict least-recently-used keys under memory pressure
  #     (rate limit keys expire naturally, so LRU is safe here)
  #   - save "": persistence disabled — rate limit state is ephemeral by design
  redis:
    image: redis:7-alpine
    container_name: kwikid-redis
    command:
      - redis-server
      - --maxmemory
      - 256mb
      - --maxmemory-policy
      - allkeys-lru
      - --save
      - ""
    ports:
      - "6379:6379"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    deploy:
      resources:
        limits:
          memory: 300m

