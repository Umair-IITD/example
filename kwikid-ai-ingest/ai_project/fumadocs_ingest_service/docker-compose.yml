services:
  fumadocs-api:
    container_name: fumadocs-api
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      - ./:/app
    restart: unless-stopped

