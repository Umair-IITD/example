# monitoring/docker-compose.monitoring.yml
#
# Monitoring stack for KwikID AI Ingest Service.
# Launches Prometheus + Grafana alongside the service.
#
# Usage:
#   # Start monitoring stack only (assumes service is running on port 8000):
#   docker-compose -f monitoring/docker-compose.monitoring.yml up -d
#
#   # Prometheus UI: http://localhost:9090
#   # Grafana UI:    http://localhost:3000  (admin / admin — change on first login)
#
# Production notes:
#   - Set GRAFANA_ADMIN_PASSWORD env var before starting.
#   - Mount a persistent volume for Grafana data in production.
#   - The service must expose /metrics on a network reachable by Prometheus.

version: "3.8"

services:

  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: kwikid_prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=30d"
      - "--web.console.libraries=/etc/prometheus/console_libraries"
      - "--web.console.templates=/etc/prometheus/consoles"
      - "--web.enable-lifecycle"
    extra_hosts:
      # Allows prometheus to reach the host machine's port 8000 (where the service runs).
      - "host.docker.internal:host-gateway"
    networks:
      - monitoring

  grafana:
    image: grafana/grafana:10.4.0
    container_name: kwikid_grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_ROOT_URL: "%(protocol)s://%(domain)s:%(http_port)s/"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    networks:
      - monitoring
    depends_on:
      - prometheus

volumes:
  prometheus_data:
    driver: local
  grafana_data:
    driver: local

networks:
  monitoring:
    driver: bridge
