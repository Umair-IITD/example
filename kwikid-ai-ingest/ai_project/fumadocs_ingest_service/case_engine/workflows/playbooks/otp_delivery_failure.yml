workflow_id: otp_delivery_failure_v2
topic: OTP_Delivery_Failure
version: "3.0"
name: OTP Delivery Failure — L1 Investigation
description: >
  Sprint 2.5.6 rewrite per Blueprint §2 (L1 Responsibilities) and §6 (Clarification Engine).

  L1 does NOT resolve the issue immediately. L1 investigates:
  1. Requests URN and Session ID from the bank agent (NOT phone number)
  2. Looks up session in the Unity admin portal (GetSessionDetails)
  3. Retrieves OTP delivery logs (LogTool, GetFailureReasonTool)
  4. Determines root cause (SMS gateway failure, DND block, limit exceeded, etc.)
  5. Generates L1 Observation and writes it to Freshdesk internal note
  6. Escalates to L2 if investigation is inconclusive

  OTP resend (resolution) is a SUBSEQUENT action — gated on L1 observation review.

# Sprint 2.5.6: required_slots are INVESTIGATION identifiers, not resolution parameters.
# URN + Session ID → look up customer session → find OTP delivery logs → root cause.
# Phone number is NOT required for investigation (it is needed only for OTP resend,
# which happens in a later L2/resolution step after L1 observation is reviewed).
required_slots:
  - urn
  - session_id

# Sprint 2.17: Investigation metadata (advisory)
investigation_steps:
  - tool: GetSessionDetailsTool
    purpose: Retrieve VKYC session metadata and status for the given session_id
    required_input: session_id
  - tool: GetSessionLogsTool
    purpose: >
      Retrieve and curate backend log evidence for this session from the
      Multi-Tenant Log Platform. Uses the timeline from GetSessionDetailsTool.
      Log excerpt is PII-redacted and BM25-ranked before delivery.
    required_input: session_id
    optional_inputs:
      - start_epoch
      - end_epoch
      - ticket_query
  - tool: LogTool
    purpose: Retrieve OTP delivery logs for this session (GENERATE_OTP, VALIDATE_OTP, SEND_SMS events)
    required_input: session_id
  - tool: GetFailureReasonTool
    purpose: Identify specific failure reason (NETWORK / QUOTA / TIMEOUT / DND / INVALID_NUMBER)
    required_input: session_id
  - tool: GetCaseHistoryTool
    purpose: Check for prior OTP failures on this URN to assess escalation risk
    required_input: urn

tool_candidates:
  - GetSessionDetailsTool
  - GetSessionLogsTool
  - LogTool
  - GetFailureReasonTool
  - GetCaseHistoryTool
  - GetUserDetailsTool

resolution_paths:
  l1_observation: write_l1_observation
  escalation_missing_slots: escalate_missing_slots
  escalation_investigation_failed: escalate_investigation_failed
  escalation_inconclusive: escalate_inconclusive

entry_conditions:
  - field: urn
    operator: exists
    description: URN must be present before investigation can begin
  - field: session_id
    operator: exists
    description: Session ID must be present to retrieve OTP delivery logs

steps:
  # ── Phase 0: Clarification ─────────────────────────────────────────────────
  # Ask for URN and Session ID. DO NOT ask for phone number or channel.
  - step_id: clarify_investigation_slots
    type: CLARIFY
    name: Request URN and Session ID for Investigation
    description: >
      Verify that urn and session_id are available for investigation.
      If missing, send the bank agent a clarification request asking for these
      investigation identifiers — not phone number or channel.
      Blueprint §6: "If URN or Session ID is missing, the system MUST ask for them."
    on_success: investigate_otp_delivery
    on_failure: escalate_missing_slots

  # ── Phase 1: Investigation ─────────────────────────────────────────────────
  - step_id: investigate_otp_delivery
    type: INVESTIGATE
    name: Investigate OTP Delivery Failure via Session Logs
    description: >
      Call Unity Admin Portal tools to collect evidence:
        1. GetSessionDetails: retrieve session state, customer details, timestamps
        2. LogTool: retrieve GENERATE_OTP, VALIDATE_OTP, SEND_SMS events
        3. GetFailureReasonTool: identify root cause category
        4. GetCaseHistoryTool: check for repeat failures
      Root cause categories: NETWORK / SMS_GATEWAY_TIMEOUT / QUOTA_EXCEEDED /
        DND_BLOCKED / INVALID_NUMBER / OTP_EXPIRED / PROVIDER_ERROR
    on_success: knowledge_lookup
    on_failure: escalate_investigation_failed

  # ── Phase 2: Knowledge Lookup ──────────────────────────────────────────────
  - step_id: knowledge_lookup
    type: KNOWLEDGE_LOOKUP
    name: Look Up OTP Delivery SOPs
    description: >
      Search the knowledge base for SOPs relevant to the identified root cause.
      Used by the Reasoning Engine to formulate the recommended action.
    on_success: reason_and_observe
    on_failure: escalate_knowledge_failed

  # ── Phase 3: Reasoning + L1 Observation ───────────────────────────────────
  - step_id: reason_and_observe
    type: REASON
    name: Reason About Root Cause and Generate L1 Observation
    description: >
      Apply investigation evidence + SOP knowledge to determine:
        - Root cause category and confidence
        - Whether OTP resend is appropriate (requires high-confidence root cause)
        - Whether escalation to L2 is required (inconclusive evidence)
      Generate L1 Observation note (written to Freshdesk internal note by handler).
      Blueprint §14: OBSGEN → FDNOTE mandatory before any customer reply.
    on_success: write_l1_observation
    on_failure: escalate_reasoning_failed

  # ── Phase 4: L1 Observation Output ────────────────────────────────────────
  # L1 STOPS HERE. OTP resend (PROPOSE_ACTION) requires L1 observation to be
  # reviewed. Action proposal is deferred to the next interaction cycle.
  - step_id: write_l1_observation
    type: RESOLVE_CASE
    name: L1 Investigation Complete — Observation Written
    description: >
      L1 investigation is complete. The observation note has been written to
      Freshdesk internal notes. The case is set to AWAITING_INPUT pending
      L2 review or bank agent response.
      The system does NOT proceed to OTP resend in this step — that is a
      subsequent L2 action gated on observation review.
    on_success: RESOLVE
    on_failure: escalate_observation_failed

  # ── Terminal: Escalations ──────────────────────────────────────────────────
  - step_id: escalate_missing_slots
    type: ESCALATE_CASE
    name: Escalate — URN or Session ID missing
    description: >
      Cannot investigate OTP delivery failure without URN and Session ID.
      Clarification has been requested from the bank agent.
    on_success: ESCALATE
    on_failure: ESCALATE

  - step_id: escalate_investigation_failed
    type: ESCALATE_CASE
    name: Escalate — session/log lookup failed
    description: >
      GetSessionDetails or LogTool returned an error or empty result.
      Escalate to L2 for manual investigation.
    on_success: ESCALATE
    on_failure: ESCALATE

  - step_id: escalate_knowledge_failed
    type: ESCALATE_CASE
    name: Escalate — SOP lookup failed
    description: >
      Knowledge base search returned no usable guidance.
      Escalate for manual SOP lookup.
    on_success: ESCALATE
    on_failure: ESCALATE

  - step_id: escalate_reasoning_failed
    type: ESCALATE_CASE
    name: Escalate — reasoning inconclusive
    description: >
      Root cause could not be determined with sufficient confidence.
      Escalate to L2 for manual root cause analysis.
    on_success: ESCALATE
    on_failure: ESCALATE

  - step_id: escalate_observation_failed
    type: ESCALATE_CASE
    name: Escalate — observation generation failed
    description: >
      L1 observation could not be generated or written to Freshdesk.
      Escalate to L2 for manual observation.
    on_success: ESCALATE
    on_failure: ESCALATE

  - step_id: escalate_inconclusive
    type: ESCALATE_CASE
    name: Escalate — investigation inconclusive
    description: >
      Investigation completed but root cause remains inconclusive.
      Escalate to L2 engineering for deeper analysis.
    on_success: ESCALATE
    on_failure: ESCALATE
